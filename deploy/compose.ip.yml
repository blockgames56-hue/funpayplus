services:
  caddy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_IP: ${PUBLIC_IP:?Set PUBLIC_IP for domain-free HTTPS}
    volumes:
      - ./deploy/Caddyfile.ip:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
volumes:
  caddy_data:
  caddy_config:
